<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GalaxyDMO - Spiral Key Ring Craft & Families</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --border-color: #30363d;
            --text-color: #c9d1d9;
            --accent-color: #58a6ff;
            --success-color: #2ea043;
            --highlight-color: #1f6feb;
            --tab-bg: #21262d;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: var(--accent-color);
            margin-bottom: 20px;
        }

        .tabs-nav {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            background-color: var(--tab-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .tab-btn:hover, .tab-btn.active {
            background-color: var(--highlight-color);
            border-color: var(--accent-color);
            color: #fff;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .craft-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .craft-container {
                grid-template-columns: 1fr;
            }
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: bold;
            text-align: center;
            padding: 10px;
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            margin-bottom: 15px;
        }

        .list-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 500px;
            overflow-y: auto;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background-color: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .item-row:hover, .item-row.active {
            background-color: var(--highlight-color);
            border-color: var(--accent-color);
        }

        .item-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .item-icon {
            width: 36px;
            height: 36px;
            border-radius: 4px;
            background-color: #21262d;
            border: 1px solid var(--border-color);
            object-fit: contain;
            padding: 2px;
        }

        .item-details span {
            display: block;
        }

        .item-name {
            color: #56d364;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .item-cost {
            font-size: 0.85rem;
            color: #8b949e;
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 2px;
        }

        .currency-icon {
            width: 16px;
            height: 16px;
            object-fit: contain;
            vertical-align: middle;
            display: inline-block;
        }

        .success-rate {
            color: #3fb950;
            font-weight: bold;
            font-size: 1rem;
        }

        .materials-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .material-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 15px;
            background-color: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: 6px;
        }

        .material-name {
            font-weight: 500;
        }

        .material-count {
            font-weight: bold;
            color: #f85149;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .npc-section {
            background: rgba(0, 210, 255, 0.05);
            border: 1px solid rgba(0, 210, 255, 0.2);
            border-radius: 8px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
        }

        .npc-visuals {
            display: flex;
            gap: 10px;
        }

        .npc-img, .map-img {
            width: 80px;
            height: 80px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: #000;
            object-fit: cover;
        }
    </style>
</head>

        function parseCurrencyIcons(costString) {
            return costString
                .replace(/T/g, '<img src="Icons/Currency_Tera.png" alt="Tera" class="currency-icon" onerror="this.style.display=\'none\'">')
                .replace(/M/g, '<img src="Icons/Currency_Mega.png" alt="Mega" class="currency-icon" onerror="this.style.display=\'none\'">')
                .replace(/B/g, '<img src="Icons/Currency_Bit.png" alt="Bit" class="currency-icon" onerror="this.style.display=\'none\'">');
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            if (tabName === 'upgrade') {
                document.querySelector('.tabs-nav button:nth-child(1)').classList.add('active');
                document.getElementById('tab-upgrade').classList.add('active');
            } else {
                document.querySelector('.tabs-nav button:nth-child(2)').classList.add('active');
                document.getElementById('tab-family').classList.add('active');
            }
        }

        function renderProductionItems() {
            const prodList = document.getElementById('productionList');
            prodList.innerHTML = '';
            craftData.forEach((item, index) => {
                const row = document.createElement('div');
                row.className = `item-row ${index === 0 ? 'active' : ''}`;
                const formattedCost = parseCurrencyIcons(item.cost);

                row.innerHTML = `
                    <div class="item-info">
                        <img src="${item.icon}" alt="${item.name}" class="item-icon" onerror="this.src='https://raw.githubusercontent.com/jmigrade/GalaxyDMO/main/Icons/Kaiser_Goggles.png'">
                        <div class="item-details">
                            <span class="item-name">${item.name}</span>
                            <span class="item-cost">${formattedCost}</span>
                        </div>
                    </div>
                    <div class="success-rate">100%</div>
                `;
                
                row.addEventListener('click', () => {
                    prodList.querySelectorAll('.item-row').forEach(r => r.classList.remove('active'));
                    row.classList.add('active');
                    renderMaterials(item);
                });

                prodList.appendChild(row);
            });
            renderMaterials(craftData[0]);
        }

        function renderMaterials(item) {
            const matList = document.getElementById('materialsList');
            matList.innerHTML = '';
            item.materials.forEach(mat => {
                const matRow = document.createElement('div');
                matRow.className = 'material-row';
                matRow.innerHTML = `
                    <div class="item-info">
                        <img src="${mat.icon}" alt="${mat.name}" class="item-icon" onerror="this.src='https://raw.githubusercontent.com/jmigrade/GalaxyDMO/main/Icons/Spiral_Key_Ring_Lv.6+.png'">
                        <span class="material-name">${mat.name}</span>
                    </div>
                    <span class="material-count">${mat.count}</span>
                `;
                matList.appendChild(matRow);
            });
        }

        function renderFamilyItems() {
            const famList = document.getElementById('familyList');
            famList.innerHTML = '';
            familyData.forEach((item, index) => {
                const row = document.createElement('div');
                row.className = `item-row ${index === 0 ? 'active' : ''}`;
                const formattedCost = parseCurrencyIcons(item.cost);

                row.innerHTML = `
                    <div class="item-info">
                        <img src="https://raw.githubusercontent.com/jmigrade/GalaxyDMO/main/Icons/Spiral_Key_Ring_Container.png" alt="${item.name}" class="item-icon" onerror="this.src='https://raw.githubusercontent.com/jmigrade/GalaxyDMO/main/Icons/Kaiser_Goggles.png'">
                        <div class="item-details">
                            <span class="item-name">${item.name}</span>
                            <span class="item-cost">${formattedCost}</span>
                        </div>
                    </div>
                    <div class="success-rate">100%</div>
                `;
                
                row.addEventListener('click', () => {
                    famList.querySelectorAll('.item-row').forEach(r => r.classList.remove('active'));
                    row.classList.add('active');
                    renderFamilyMaterials(item);
                });

                famList.appendChild(row);
            });
            renderFamilyMaterials(familyData[0]);
        }

        function renderFamilyMaterials(item) {
            const famMatList = document.getElementById('familyMaterialsList');
            famMatList.innerHTML = '';
            item.materials.forEach(mat => {
                const matRow = document.createElement('div');
                matRow.className = 'material-row';
                matRow.innerHTML = `
                    <div class="item-info">
                        <img src="${mat.icon}" alt="${mat.name}" class="item-icon" onerror="this.src='https://raw.githubusercontent.com/jmigrade/GalaxyDMO/main/Icons/Spiral_Key_Ring_Lv.6+.png'">
                        <span class="material-name">${mat.name}</span>
                    </div>
                    <span class="material-count">${mat.count}</span>
                `;
                famMatList.appendChild(matRow);
            });
        }

        renderProductionItems();
        renderFamilyItems();
    </script>
</body>
</html>
