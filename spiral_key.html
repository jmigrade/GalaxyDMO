<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GalaxyDMO - Spiral Key Ring Craft</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --border-color: #30363d;
            --text-color: #c9d1d9;
            --accent-color: #58a6ff;
            --success-color: #2ea043;
            --highlight-color: #1f6feb;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: var(--accent-color);
            margin-bottom: 30px;
        }

        .craft-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .craft-container {
                grid-template-columns: 1fr;
            }
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: bold;
            text-align: center;
            padding: 10px;
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            margin-bottom: 15px;
        }

        .list-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 500px;
            overflow-y: auto;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background-color: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .item-row:hover, .item-row.active {
            background-color: var(--highlight-color);
            border-color: var(--accent-color);
        }

        .item-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .item-icon {
            width: 36px;
            height: 36px;
            border-radius: 4px;
            background-color: #21262d;
            border: 1px solid var(--border-color);
            object-fit: contain;
            padding: 2px;
        }
        .currency-t {
            color: #ff5555; /* Vermelho */
            font-weight: bold;
        }

        .currency-m {
            color: #56d364; /* Verde */
            font-weight: bold;
        }

        .currency-b {
            color: #e3b341; /* Amarelo / Dourado */
            font-weight: bold;
        }
        .item-details span {
            display: block;
        }

        .item-name {
            color: #56d364;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .item-cost {
            font-size: 0.8rem;
            color: #8b949e;
        }

        .success-rate {
            color: #3fb950;
            font-weight: bold;
            font-size: 1rem;
        }

        .materials-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .material-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 15px;
            background-color: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: 6px;
        }

        .material-name {
            font-weight: 500;
        }

        .material-count {
            font-weight: bold;
            color: #f85149;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        /* Caixa de Aviso do NPC */
        .npc-notice {
            background: rgba(0, 210, 255, 0.08);
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 8px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.9rem;
            color: var(--text-color);
        }

        .npc-notice strong {
            color: var(--accent-color);
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="back-link">← Voltar ao Início</a>
        <h1>Spiral Key Ring Crafting</h1>

        <div class="craft-container">
            <!-- Lado Esquerdo: Lista de Produção -->
            <div>
                <div class="section-title">Production Item</div>
                <div class="list-group" id="productionList">
                    <!-- Preenchido via JavaScript -->
                </div>
            </div>

            <!-- Lado Direito: Materiais Necessários -->
            <div>
                <div class="section-title">Necessary Material item</div>
                <div class="materials-list" id="materialsList">
                    <!-- Preenchido dinamicamente ao selecionar um item -->
                </div>
            </div>
        </div>
        
        <style>
    /* Adicione estas classes ao seu <style> existente */
    .npc-section {

        border-radius: 8px;
        padding: 20px;
        display: flex;
        align-items: center;
        gap: 20px;
        margin-top: 20px;
    }

    .npc-visuals {
        display: flex;
        gap: 10px;
    }

    .npc-img, .map-img {
        width: 80px;
        height: 80px;
        border-radius: 6px;
        border: 1px solid var(--border-color);
        background-color: #000;
        object-fit: cover;
    }
</style>

                    { name: "Aura of Cruelty [Metal Seadramon]", count: 1, icon: "https://raw.githubusercontent.com/jmigrade/GalaxyDMO/main/Icons/Aura_of_Fear_MetalSeadramon.png" }

                ]
            },
            {
                id: 8,
                name: "Spiral Key Ring Lv.Max",
                icon: "https://raw.githubusercontent.com/jmigrade/GalaxyDMO/main/Icons/Spiral_Key_Ring_Lv.6+.png",
                cost: "101 M 000 B",
                materials: [
                    { name: "Spiral Key Ring Lv.7", count: 1, icon: "https://raw.githubusercontent.com/jmigrade/GalaxyDMO/main/Icons/SSpiral_Key_Ring_Lv.6+.png" },

                ]
            }
        ];

        const productionList = document.getElementById('productionList');
        const materialsList = document.getElementById('materialsList');

        function renderProductionItems() {
            productionList.innerHTML = '';
            craftData.forEach((item, index) => {
                const row = document.createElement('div');
                row.className = `item-row ${index === 0 ? 'active' : ''}`;
                row.innerHTML = `
                    <div class="item-info">
                        <img src="${item.icon}" alt="${item.name}" class="item-icon" onerror="this.src='https://raw.githubusercontent.com/jmigrade/GalaxyDMO/main/Icons/Kaiser_Goggles.png'">
                        <div class="item-details">
                            <span class="item-name">${item.name}</span>
                            <span class="item-cost">${item.cost}</span>
                        </div>
                    </div>
                    <div class="success-rate">100%</div>
                `;
                
                row.addEventListener('click', () => {
                    document.querySelectorAll('.item-row').forEach(r => r.classList.remove('active'));
                    row.classList.add('active');
                    renderMaterials(item);
                });

                productionList.appendChild(row);
            });

            renderMaterials(craftData[0]);
        }

        function renderMaterials(item) {
            materialsList.innerHTML = '';
            item.materials.forEach(mat => {
                const matRow = document.createElement('div');
                matRow.className = 'material-row';
                matRow.innerHTML = `
                    <div class="item-info">
                        <img src="${mat.icon}" alt="${mat.name}" class="item-icon" onerror="this.src='https://raw.githubusercontent.com/jmigrade/GalaxyDMO/main/Icons/Spiral_Key_Ring_Lv.6+.png'">
                        <span class="material-name">${mat.name}</span>
                    </div>
                    <span class="material-count">${mat.count}</span>
                `;
                materialsList.appendChild(matRow);
            });
        }

        renderProductionItems();
    </script>
</body>
</html>
