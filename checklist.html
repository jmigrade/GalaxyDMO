<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GalaxyDMO - Lista de Tarefas Diárias</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --border-color: #30363d;
            --text-color: #c9d1d9;
            --accent-color: #58a6ff;
            --success-color: #2ea043;
            --highlight-color: #1f6feb;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .header-box {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            margin-bottom: 30px;
        }

        .header-box h1 {
            color: var(--accent-color);
            margin: 0 0 10px 0;
        }

        .header-box p {
            color: #8b949e;
            margin: 0;
        }

        .checklist-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .checklist-grid {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
        }

        .panel-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #f0883e;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        /* Formulário para adicionar */
        .add-form {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .add-input {
            flex: 1;
            padding: 10px;
            background-color: #0d1117;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            font-size: 0.95rem;
        }

        .add-input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .add-btn {
            padding: 10px 20px;
            background-color: var(--success-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .add-btn:hover {
            opacity: 0.9;
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 400px;
            overflow-y: auto;
        }

        .task-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 15px;
            background-color: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            transition: all 0.2s;
        }

        .task-item.completed {
            border-color: var(--success-color);
            background-color: rgba(46, 160, 67, 0.05);
        }

        .task-info {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            flex: 1;
        }

        .task-checkbox {
            width: 22px;
            height: 22px;
            accent-color: var(--success-color);
            cursor: pointer;
        }

        .task-text {
            font-size: 0.95rem;
            font-weight: 500;
        }

        .task-item.completed .task-text {
            text-decoration: line-through;
            color: #8b949e;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #f85149;
            cursor: pointer;
            font-size: 1.1rem;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .delete-btn:hover {
            background-color: rgba(248, 81, 73, 0.1);
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="back-link">← Voltar ao Menu Principal</a>
        
        <div class="header-box">
            <h1>DIGIMON GALAXY</h1>
            <p>Lista de Tarefas Diárias</p>
        </div>

        <div class="checklist-grid">
            <!-- Lado Esquerdo: Adicionar Tarefas -->
            <div class="panel">
                <div class="panel-title">Adicionar Nova Tarefa</div>
                <form class="add-form" id="taskForm">
                    <input type="text" id="taskInput" class="add-input" placeholder="Ex: Missões Shinjuku (Goggles)..." required>
                    <button type="submit" class="add-btn">Adicionar</button>
                </form>
                <div style="font-size: 0.85rem; color: #8b949e; margin-top: 10px;">
                    Escreve a atividade que pretendes realizar. Ela aparecerá automaticamente do lado direito para poderes dar check quando concluíres.
                </div>
            </div>

            <!-- Lado Direito: A tua Checklist -->
            <div class="panel">
                <div class="panel-title">Minha Checklist Diária</div>
                <div class="task-list" id="taskList">
                    <!-- Preenchido dinamicamente -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // Carregar tarefas do localStorage ou usar algumas predefinidas
        let tasks = JSON.parse(localStorage.getItem('galaxy_tasks')) || [
            { id: 1, text: "Missões Shinjuku (Goggles)", completed: true },
            { id: 2, text: "Mother (D-Reaper)", completed: true },
            { id: 3, text: "RBN e RBH", completed: true },
            { id: 4, text: "Chaotic (Resting Area)", completed: true }
        ];

        const taskForm = document.getElementById('taskForm');
        const taskInput = document.getElementById('taskInput');
        const taskList = document.getElementById('taskList');

        function saveAndRender() {
            localStorage.setItem('galaxy_tasks', JSON.stringify(tasks));
            renderTasks();
        }

        function renderTasks() {
            taskList.innerHTML = '';
            
            if (tasks.length === 0) {
                taskList.innerHTML = `<div style="color: #8b949e; text-align: center; padding: 20px;">Ainda não tens tarefas adicionadas.</div>`;
                return;
            }

            tasks.forEach(task => {
                const item = document.createElement('div');
                item.className = `task-item ${task.completed ? 'completed' : ''}`;
                
                item.innerHTML = `
                    <div class="task-info" onclick="toggleTask(${task.id})">
                        <input type="checkbox" class="task-checkbox" ${task.completed ? 'checked' : ''} onclick="event.stopPropagation(); toggleTask(${task.id})">
                        <span class="task-text">${task.text}</span>
                    </div>
                    <button class="delete-btn" onclick="deleteTask(${task.id})" title="Remover">×</button>
                `;
                taskList.appendChild(item);
            });
        }

        // Adicionar nova tarefa
        taskForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = taskInput.value.trim();
            if (text) {
                const newTask = {
                    id: Date.now(),
                    text: text,
                    completed: false
                };
                tasks.push(newTask);
                taskInput.value = '';
                saveAndRender();
            }
        });

        // Alternar estado de concluído
        window.toggleTask = function(id) {
            tasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
            saveAndRender();
        };

        // Apagar tarefa
        window.deleteTask = function(id) {
            tasks = tasks.filter(t => t.id !== id);
            saveAndRender();
        };

        // Renderizar inicial
        renderTasks();
    </script>
</body>
</html>
