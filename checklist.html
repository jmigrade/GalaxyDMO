<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digimon Galaxy - Checklist</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --accent-color: #00d2ff;
            --accent-orange: #ff7b00;
            --accent-purple: #a855f7;
            --text-color: #f0f6fc;
            --text-muted: #8b949e;
            --border-color: #30363d;
            --completed-color: #238636;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .top-nav {
            width: 100%;
            max-width: 1200px;
            padding: 20px 20px 0 20px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            text-decoration: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .back-btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
            background-color: rgba(0, 210, 255, 0.05);
        }

        .main-content {
            width: 100%;
            max-width: 1200px;
            padding: 20px;
            padding-bottom: 90px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            padding: 16px 12px;
            background: linear-gradient(135deg, #1f293d, #111827);
            border-radius: 12px;
            border: 1px solid var(--accent-color);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.2);
        }

        h1 {
            font-size: 1.4rem;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        p.subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        @media (min-width: 900px) {
            .dashboard-grid {
                grid-template-columns: 1fr 1fr;
                align-items: start;
            }
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .category-card {
            background: var(--card-bg);
            border-radius: 10px;
            border: 1px solid var(--border-color);
            padding: 16px;
        }

        .category-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--accent-orange);
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
        }

        .todo-list {
            list-style: none;
            margin-top: 10px;
        }

        .todo-item {
            display: flex;
            align-items: center;
            padding: 10px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            border: 1px solid transparent;
        }

        .todo-item:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .todo-item.completed {
            background: rgba(35, 134, 54, 0.15);
            border-color: rgba(35, 134, 54, 0.4);
        }

        .todo-item.completed .todo-text {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .checkbox {
            width: 22px;
            height: 22px;
            border-radius: 6px;
            border: 2px solid var(--accent-color);
            margin-right: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .todo-item.completed .checkbox {
            background-color: var(--completed-color);
            border-color: var(--completed-color);
        }

        .checkbox::after {
            content: '✓';
            color: white;
            font-size: 14px;
            font-weight: bold;
            display: none;
        }

        .todo-item.completed .checkbox::after {
            display: block;
        }

        .item-icon {
            width: 34px;
            height: 34px;
            margin-right: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .todo-text {
            font-size: 0.95rem;
            flex-grow: 1;
        }

        .controls {
            position: fixed;
            bottom: 16px;
            right: 16px;
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
        }

        .btn-reset { background-color: var(--accent-orange); color: white; }
    </style>
</head>
<body>

    <div class="top-nav">
        <a href="index.html" class="back-btn">
            ← Voltar ao Menu Principal
        </a>
    </div>

    <main class="main-content">
        <header>
            <h1>Digimon Galaxy</h1>
            <p class="subtitle">Lista de Tarefas Diárias</p>
        </header>

        <div class="dashboard-grid">
            <div class="column">
                <div class="category-card">
                    <div class="category-title">Missões Especiais</div>
                    <ul class="todo-list">
                        <li class="todo-item" data-id="shinjuku">
                            <div class="checkbox"></div>
                            <span class="item-icon">👓</span>
                            <span class="todo-text">Missões Shinjuku (Goggles)</span>
                        </li>
                    </ul>
                </div>
            </div>

            <div class="column">
                <div class="category-card">
                    <div class="category-title">Coletar Passes</div>
                    <ul class="todo-list">
                        <li class="todo-item" data-id="mother">
                            <div class="checkbox"></div>
                            <span class="item-icon">🎟️</span>
                            <span class="todo-text">Mother (D-Reaper)</span>
                        </li>
                        <li class="todo-item" data-id="rbn-rbh">
                            <div class="checkbox"></div>
                            <span class="item-icon">📜</span>
                            <span class="todo-text">RBN e RBH</span>
                        </li>
                        <li class="todo-item" data-id="chaotic">
                            <div class="checkbox"></div>
                            <span class="item-icon">⚡</span>
                            <span class="todo-text">Chaotic (Resting Area)</span>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </main>

    <div class="controls">
        <button class="btn btn-reset" onclick="resetAll()">Reset Diário</button>
    </div>

    <script>
        let state = JSON.parse(localStorage.getItem('digimon_todo_state')) || {};

        document.querySelectorAll('.todo-item').forEach(item => {
            const id = item.getAttribute('data-id');
            if (state[id]) item.classList.add('completed');

            item.addEventListener('click', () => {
                state[id] = !state[id];
                item.classList.toggle('completed', state[id]);
                localStorage.setItem('digimon_todo_state', JSON.stringify(state));
            });
        });

        function resetAll() {
            if (confirm('Deseja desmarcar todas as tarefas?')) {
                state = {};
                document.querySelectorAll('.todo-item').forEach(i => i.classList.remove('completed'));
                localStorage.removeItem('digimon_todo_state');
            }
        }
    </script>
</body>
</html>
