<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digimon Galaxy - Spiral Key Ring</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --sidebar-bg: #11161d;
            --accent-color: #00d2ff;
            --accent-orange: #ff7b00;
            --accent-purple: #a855f7;
            --text-color: #f0f6fc;
            --text-muted: #8b949e;
            --border-color: #30363d;
            --completed-color: #238636;
            --sidebar-width: 260px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            min-height: 100vh;
        }

        /* --- MENU LATERAL (SIDEBAR) --- */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            padding: 20px 14px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            height: 100vh;
            position: sticky;
            top: 0;
            flex-shrink: 0;
        }

        .sidebar-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent-color);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        .nav-menu {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            color: var(--text-color);
            text-decoration: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid transparent;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .nav-link:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--border-color);
        }

        .nav-link.active {
            background: rgba(0, 210, 255, 0.1);
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .nav-link.crafting-link {
            background: rgba(168, 85, 247, 0.1);
            border-color: rgba(168, 85, 247, 0.3);
            color: #d2a8ff;
        }

        .nav-link.crafting-link:hover {
            background: rgba(168, 85, 247, 0.2);
            border-color: var(--accent-purple);
        }

        /* --- CONTEÚDO PRINCIPAL --- */
        .main-content {
            flex-grow: 1;
            padding: 20px;
            max-width: 1200px;
            padding-bottom: 90px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            padding: 16px 12px;
            background: linear-gradient(135deg, #1f293d, #111827);
            border-radius: 12px;
            border: 1px solid var(--accent-purple);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.2);
        }

        h1 {
            font-size: 1.4rem;
            color: #d2a8ff;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        p.subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .craft-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 900px) {
            .craft-container {
                grid-template-columns: 1fr 1fr;
                align-items: start;
            }
        }

        .category-card {
            background: var(--card-bg);
            border-radius: 10px;
            border: 1px solid var(--border-color);
            padding: 16px;
        }

        .category-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--accent-orange);
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
        }

        .list-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 520px;
            overflow-y: auto;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background-color: rgba(255, 255, 255, 0.02);
            border: 1px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .item-row:hover {
            background-color: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .item-row.active {
            background-color: rgba(168, 85, 247, 0.15);
            border-color: rgba(168, 85, 247, 0.4);
        }

        .item-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .item-icon {
            width: 34px;
            height: 34px;
            border-radius: 6px;
            background-color: #21262d;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .item-details span {
            display: block;
        }

        .item-name {
            color: var(--text-color);
            font-weight: 600;
            font-size: 0.9rem;
        }

        .item-cost {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .success-rate {
            color: #3fb950;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .materials-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .material-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            background-color: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }

        .material-name {
            font-weight: 500;
            font-size: 0.9rem;
        }

        .material-count {
            font-weight: bold;
            color: #f85149;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; position: relative; }
        }
    </style>
</head>
<body>

    <!-- SIDEBAR DE NAVEGAÇÃO -->
    <aside class="sidebar">
        <div class="sidebar-title">Digimon Galaxy</div>
        <ul class="nav-menu">
            <li>
                <a href="index.html" class="nav-link">
                    📋 Checklist Diário
                </a>
            </li>
            <li>
                <a href="true_digivice.html" class="nav-link crafting-link">
                    ⚡ True Digivice Steps
                </a>
            </li>
            <li>
                <a href="four_holy_beast.html" class="nav-link crafting-link">
                    💍 Four Holy Beast Ring
                </a>
            </li>
            <li>
                <a href="tamer_goggles.html" class="nav-link crafting-link">
                    🥽 Tamer's Goggles
                </a>
            </li>
            <li>
                <a href="SpiralKeyRing.html" class="nav-link crafting-link active">
                    🌀 Spiral Key Ring
                </a>
            </li>
        </ul>
    </aside>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="main-content">
        <header>
            <h1>Spiral Key Ring</h1>
            <p class="subtitle">Guia de Evolução e Materiais de Craft</p>
        </header>

        <div class="craft-container">
            <!-- Lado Esquerdo: Lista de Produção -->
            <div class="category-card">
                <div class="category-title">Production Item</div>
                <div class="list-group" id="productionList">
                    <!-- Preenchido via JavaScript -->
                </div>
            </div>

            <!-- Lado Direito: Materiais Necessários -->
            <div class="category-card">
                <div class="category-title">Necessary Material Item</div>
                <div class="materials-list" id="materialsList">
                    <!-- Preenchido dinamicamente ao selecionar um item -->
                </div>
            </div>
        </div>
    </main>

    <script>
        const craftData = [
            {
                id: 1,
                name: "Spiral Key Ring Lv1",
                cost: "101 M 000 B",
                materials: [
                    { name: "Spiral Key Ring Lv1", count: 1, icon: "🌀" },
                    { name: "Aura de Dominação", count: 110, icon: "✨" }
                ]
            },
            {
                id: 2,
                name: "Spiral Key Ring Lv2",
                cost: "101 M 000 B",
                materials: [
                    { name: "Spiral Key Ring Lv2", count: 1, icon: "🌀" },
                    { name: "Aura de Dominação", count: 340, icon: "✨" },
                    { name: "Aura of Fear [MetalSeadramon]", count: 2, icon: "💠" }
                ]
            },
            {
                id: 3,
                name: "Spiral Key Ring Lv3",
                cost: "101 M 000 B",
                materials: [
                    { name: "Spiral Key Ring Lv3", count: 1, icon: "🌀" },
                    { name: "Aura de Dominação", count: 600, icon: "✨" },
                    { name: "Aura of Fear [MetalSeadramon]", count: 4, icon: "💠" }
                ]
            },
            {
                id: 4,
                name: "Spiral Key Ring Lv4",
                cost: "101 M 000 B",
                materials: [
                    { name: "Spiral Key Ring Lv4", count: 1, icon: "🌀" },
                    { name: "Aura de Dominação", count: 1160, icon: "✨" },
                    { name: "Aura of Fear [MetalSeadramon]", count: 6, icon: "💠" }
                ]
            },
            {
                id: 5,
                name: "Spiral Key Ring Lv5",
                cost: "101 M 000 B",
                materials: [
                    { name: "Spiral Key Ring Lv5", count: 1, icon: "🌀" },
                    { name: "Aura de Dominação", count: 1400, icon: "✨" },
                    { name: "Aura of Fear [MetalSeadramon]", count: 8, icon: "💠" },
                    { name: "Aura of Cruelty [Metal Seadramon]", count: 1, icon: "🔥" }
                ]
            },
            {
                id: 6,
                name: "Spiral Key Ring Lv6",
                cost: "101 M 000 B",
                materials: [
                    { name: "Spiral Key Ring Lv6", count: 1, icon: "🌀" },
                    { name: "Aura de Dominação", count: 1820, icon: "✨" },
                    { name: "Aura of Fear [MetalSeadramon]", count: 10, icon: "💠" },
                    { name: "Aura of Cruelty [Metal Seadramon]", count: 3, icon: "🔥" }
                ]
            },
            {
                id: 7,
                name: "Spiral Key Ring Lv7",
                cost: "101 M 000 B",
                materials: [
                    { name: "Spiral Key Ring Lv7", count: 1, icon: "🌀" },
                    { name: "Aura de Dominação", count: 2500, icon: "✨" },
                    { name: "Aura of Fear [MetalSeadramon]", count: 20, icon: "💠" },
                    { name: "Aura of Cruelty [Metal Seadramon]", count: 5, icon: "🔥" }
                ]
            },
            {
                id: 8,
                name: "Spiral Key Ring LvMax",
                cost: "101 M 000 B",
                materials: [
                    { name: "Spiral Key Ring LvMax", count: 1, icon: "🌀" },
                    { name: "Aura de Dominação", count: 1100, icon: "✨" },
                    { name: "Aura of Fear [MetalSeadramon]", count: 10, icon: "💠" },
                    { name: "Aura of Cruelty [Metal Seadramon]", count: 2, icon: "🔥" }
                ]
            }
        ];

        const productionList = document.getElementById('productionList');
        const materialsList = document.getElementById('materialsList');

        function renderProductionItems() {
            productionList.innerHTML = '';
            craftData.forEach((item, index) => {
                const row = document.createElement('div');
                row.className = `item-row ${index === 0 ? 'active' : ''}`;
                row.innerHTML = `
                    <div class="item-info">
                        <div class="item-icon">📦</div>
                        <div class="item-details">
                            <span class="item-name">${item.name}</span>
                            <span class="item-cost">${item.cost}</span>
                        </div>
                    </div>
                    <div class="success-rate">100%</div>
                `;
                
                row.addEventListener('click', () => {
                    document.querySelectorAll('.item-row').forEach(r => r.classList.remove('active'));
                    row.classList.add('active');
                    renderMaterials(item);
                });

                productionList.appendChild(row);
            });

            renderMaterials(craftData[0]);
        }

        function renderMaterials(item) {
            materialsList.innerHTML = '';
            item.materials.forEach(mat => {
                const matRow = document.createElement('div');
                matRow.className = 'material-row';
                matRow.innerHTML = `
                    <div class="item-info">
                        <div class="item-icon">${mat.icon}</div>
                        <span class="material-name">${mat.name}</span>
                    </div>
                    <span class="material-count">0 / ${mat.count}</span>
                `;
                materialsList.appendChild(matRow);
            });
        }

        renderProductionItems();
    </script>
</body>
</html>
