<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda de Hoje no Game - Digimon Galaxy</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-color: #f0f6fc;
            --text-muted: #8b949e;
            --border-color: #30363d;
            --accent-color: #a855f7;
            --accent-green: #238636;
            --color-digivice: #00d2ff;
            --color-brt: #ff7b00;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 30px 15px;
        }

        .container {
            width: 100%;
            max-width: 950px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* HEADER */
        .page-header {
            text-align: center;
            padding: 24px 20px;
            background: linear-gradient(135deg, #1f293d, #111827);
            border-radius: 14px;
            border: 1px solid var(--border-color);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.15);
            position: relative;
        }

        .back-btn {
            position: absolute;
            left: 20px;
            top: 24px;
            color: var(--color-digivice);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: opacity 0.2s;
        }

        .back-btn:hover {
            opacity: 0.8;
        }

        .page-header h1 {
            font-size: 1.8rem;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .page-header p {
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        /* TABELA DE HORÁRIOS */
        .table-container {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            overflow-x: auto;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.92rem;
        }

        th, td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: #1c2128;
            color: var(--accent-color);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: rgba(255, 255, 255, 0.02);
        }

        .bonus-badge {
            display: inline-block;
            background: rgba(35, 134, 54, 0.2);
            color: #3fb950;
            border: 1px solid rgba(35, 134, 54, 0.4);
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .time-cell-pt {
            font-family: monospace;
            font-size: 0.95rem;
            color: var(--color-digivice);
            white-space: nowrap;
        }

        .time-cell-brt {
            font-family: monospace;
            font-size: 0.95rem;
            color: var(--color-brt);
            white-space: nowrap;
        }

        @media (max-width: 650px) {
            .page-header {
                padding-top: 50px;
            }
            .back-btn {
                top: 16px;
            }
            th, td {
                padding: 10px 10px;
                font-size: 0.82rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- HEADER -->
        <header class="page-header">
            <a href="index.html" class="back-btn">← Voltar ao Hub</a>
            <h1>Agenda do Jogo</h1>
            <p>Comparativo de horários entre <strong>Brasil (BRT)</strong> e <strong>Portugal (PT)</strong></p>
        </header>

        <!-- TABELA DIRETA -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Horário (BRT)</th>
                        <th>Horário (PT)</th>
                        <th>Evento</th>
                        <th>Bônus</th>
                    </tr>
                </thead>
                <tbody id="schedule-body">
                    <!-- Preenchido via JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Eventos na hora original de Brasília (BRT / UTC-3)
        const eventsBRT = [
            { start: "00:00", end: "00:10", name: "Bits dos monstros", bonus: "x1.5" },
            { start: "01:00", end: "01:10", name: "Drop de fragmentos e materiais", bonus: "x1.5" },
            { start: "02:00", end: "02:10", name: "Fadiga recupera mais rápido", bonus: "x2" },
            { start: "03:00", end: "03:10", name: "Drop de scan data", bonus: "x1.5" },
            { start: "04:00", end: "04:15", name: "Craft com menos material", bonus: "-10%" },
            { start: "05:00", end: "05:30", name: "Chance de chocagem", bonus: "x2" },
            { start: "06:00", end: "06:10", name: "Fadiga enche mais devagar", bonus: "x2" },
            { start: "07:00", end: "07:10", name: "Drop de selos", bonus: "x2" },
            { start: "08:00", end: "08:10", name: "Drop de digiclone", bonus: "x1.5" },
            { start: "09:00", end: "10:00", name: "EXP (Digimon e Tamer)", bonus: "x5" },
            { start: "10:00", end: "10:10", name: "Drop de ovos", bonus: "x1.5" },
            { start: "11:00", end: "11:10", name: "Quantidade de drop", bonus: "x1.5" },
            { start: "12:00", end: "12:10", name: "Bits dos monstros", bonus: "x1.5" },
            { start: "13:00", end: "13:15", name: "Chance de drop (todos os itens)", bonus: "x1.5" },
            { start: "14:00", end: "14:10", name: "Drop de fragmentos e materiais", bonus: "x1.5" },
            { start: "15:00", end: "16:00", name: "EXP (Digimon e Tamer)", bonus: "x5" },
            { start: "16:00", end: "16:10", name: "Recompensa do scanner", bonus: "x1.5" },
            { start: "17:00", end: "17:10", name: "Drop dentro de dungeon", bonus: "x1.5" },
            { start: "18:00", end: "18:10", name: "Bits dos monstros", bonus: "x1.5" },
            { start: "19:00", end: "19:30", name: "Chance de enchant", bonus: "x2" },
            { start: "20:00", end: "20:15", name: "Chance de drop (todos os itens)", bonus: "x1.5" },
            { start: "21:00", end: "22:00", name: "EXP (Digimon e Tamer)", bonus: "x5" },
            { start: "22:00", end: "22:10", name: "Drop de ovos", bonus: "x1.5" },
            { start: "22:15", end: "22:25", name: "Invasão de monstros", bonus: "—" },
            { start: "23:00", end: "23:10", name: "Quantidade de drop", bonus: "x1.5" }
        ];

        // Função para converter HH:MM de BRT (UTC-3) para o fuso horário de Portugal (Europe/Lisbon)
        function convertBRTToPortugal(timeStr) {
            const [hours, minutes] = timeStr.split(':').map(Number);
            const now = new Date();
            
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hh = String(hours).padStart(2, '0');
            const mm = String(minutes).padStart(2, '0');

            const brtDate = new Date(`${year}-${month}-${day}T${hh}:${mm}:00-03:00`);

            const portugalTimeStr = brtDate.toLocaleTimeString('pt-PT', {
                timeZone: 'Europe/Lisbon',
                hour: '2-digit',
                minute: '2-digit',
                hour12: false
            });

            return portugalTimeStr;
        }

        // Preencher a tabela ao carregar
        function renderSchedule() {
            const tbody = document.getElementById('schedule-body');
            tbody.innerHTML = '';

            eventsBRT.forEach(ev => {
                const brtRange = `${ev.start} - ${ev.end}`;
                const ptStart = convertBRTToPortugal(ev.start);
                const ptEnd = convertBRTToPortugal(ev.end);
                const ptRange = `${ptStart} - ${ptEnd}`;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="time-cell-brt">${brtRange}</td>
                    <td class="time-cell-pt">${ptRange}</td>
                    <td><strong>${ev.name}</strong></td>
                    <td><span class="bonus-badge">${ev.bonus}</span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        document.addEventListener('DOMContentLoaded', renderSchedule);
    </script>

</body>
</html>
