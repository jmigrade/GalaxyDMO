<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda de Hoje no Game - Digimon Galaxy</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-color: #f0f6fc;
            --text-muted: #8b949e;
            --border-color: #30363d;
            --accent-color: #a855f7;
            --accent-green: #238636;
            --color-digivice: #00d2ff;
            --color-brt: #ff7b00;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 30px 15px;
        }

        .container {
            width: 100%;
            max-width: 980px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* HEADER */
        .page-header {
            text-align: center;
            padding: 24px 20px;
            background: linear-gradient(135deg, #1f293d, #111827);
            border-radius: 14px;
            border: 1px solid var(--border-color);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.15);
            position: relative;
        }

        .back-btn {
            position: absolute;
            left: 20px;
            top: 24px;
            color: var(--color-digivice);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: opacity 0.2s;
        }

        .back-btn:hover {
            opacity: 0.8;
        }

        .page-header h1 {
            font-size: 1.8rem;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .page-header p {
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        /* BARRA DE CONTROLO / CONFIGURAÇÃO */
        .status-bar {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: var(--text-muted);
            flex-wrap: wrap;
            gap: 15px;
        }

        .timezone-selector {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .timezone-selector select {
            background: #1c2128;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .clock-display {
            font-weight: bold;
            font-family: monospace;
            font-size: 1.05rem;
            color: var(--color-digivice);
        }

        .actions-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .notif-btn {
            background: rgba(0, 210, 255, 0.15);
            color: var(--color-digivice);
            border: 1px solid var(--color-digivice);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .notif-btn:hover {
            background: var(--color-digivice);
            color: #000;
        }

        .test-sound-btn {
            background: rgba(168, 85, 247, 0.15);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .test-sound-btn:hover {
            background: var(--accent-color);
            color: #fff;
            transform: scale(1.05);
        }

        /* TABELA DE HORÁRIOS */
        .table-container {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            overflow-x: auto;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.92rem;
        }

        th, td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: #1c2128;
            color: var(--accent-color);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: rgba(255, 255, 255, 0.02);
        }

        /* ESTILO QUANDO O EVENTO ESTÁ ATIVO */
        tr.active-event {
            background-color: rgba(168, 85, 247, 0.18) !important;
            animation: pulse-border 2s infinite;
        }

        @keyframes pulse-border {
            0% { box-shadow: inset 0 0 0 1px rgba(168, 85, 247, 0.4); }
            50% { box-shadow: inset 0 0 0 2px rgba(168, 85, 247, 0.9); }
            100% { box-shadow: inset 0 0 0 1px rgba(168, 85, 247, 0.4); }
        }

        .bonus-badge {
            display: inline-block;
            background: rgba(35, 134, 54, 0.2);
            color: #3fb950;
            border: 1px solid rgba(35, 134, 54, 0.4);
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .time-cell-brt {
            font-family: monospace;
            font-size: 0.95rem;
            color: var(--color-brt);
            white-space: nowrap;
        }

        .time-cell-pt {
            font-family: monospace;
            font-size: 0.95rem;
            color: var(--color-digivice);
            white-space: nowrap;
        }

        .alarm-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--accent-color);
        }

        .center-col {
            text-align: center;
        }

        @media (max-width: 650px) {
            .page-header {
                padding-top: 50px;
            }
            .back-btn {
                top: 16px;
            }
            th, td {
                padding: 10px 8px;
                font-size: 0.82rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- HEADER -->
        <header class="page-header">
            <a href="index.html" class="back-btn">← Voltar ao Hub</a>
            <h1>Agenda do Jogo</h1>
            <p>Selecione o seu fuso horário e marque os alertas para os eventos que deseja</p>
        </header>

        <!-- BARRA DE CONFIGURAÇÃO DE FUSO E RELÓGIO -->
        <div class="status-bar">
            <div class="timezone-selector">
                <label for="tz-select"><strong>O seu Fuso Horário:</strong></label>
                <select id="tz-select" onchange="changeTimezone()">
                    <option value="Europe/Lisbon">Portugal (PT - WET/WEST)</option>
                    <option value="America/Sao_Paulo">Brasil - Brasília (BRT)</option>
                </select>
            </div>
            <div>
                <span>Hora Local: </span>
                <span id="current-time-local" class="clock-display">--:--:--</span>
            </div>
            <div class="actions-group">
                <button id="enable-notif-btn" class="notif-btn" onclick="requestNotificationPermission()">
                    🔔 Ativar Notificações
                </button>
                <button class="test-sound-btn" onclick="testSoundAndNotif()" title="Testar Som do Alerta">
                    🔔
                </button>
            </div>
        </div>

        <!-- TABELA DIRETA -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th class="center-col">Alerta 🔔</th>
                        <th>Horário (BRT)</th>
                        <th>Horário (PT)</th>
                        <th>Evento</th>
                        <th>Bônus</th>
                    </tr>
                </thead>
                <tbody id="schedule-body">
                    <!-- Preenchido via JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- ELEMENTO DE ÁUDIO COM O SOM REAL DO DIGIVICE -->
    <audio id="digivice-audio" preload="auto">
    <source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" type="audio/mpeg">
</audio>

    <script>
        const eventsBRT = [
            { id: "ev_0", start: "00:00", end: "00:10", name: "Bits dos monstros", bonus: "x1.5" },
            { id: "ev_1", start: "01:00", end: "01:10", name: "Drop de fragmentos e materiais", bonus: "x1.5" },
            { id: "ev_2", start: "02:00", end: "02:10", name: "Fadiga recupera mais rápido", bonus: "x2" },
            { id: "ev_3", start: "03:00", end: "03:10", name: "Drop de scan data", bonus: "x1.5" },
            { id: "ev_4", start: "04:00", end: "04:15", name: "Craft com menos material", bonus: "-10%" },
            { id: "ev_5", start: "05:00", end: "05:30", name: "Chance de chocagem", bonus: "x2" },
            { id: "ev_6", start: "06:00", end: "06:10", name: "Fadiga enche mais devagar", bonus: "x2" },
            { id: "ev_7", start: "07:00", end: "07:10", name: "Drop de selos", bonus: "x2" },
            { id: "ev_8", start: "08:00", end: "08:10", name: "Drop de digiclone", bonus: "x1.5" },
            { id: "ev_9", start: "09:00", end: "10:00", name: "EXP (Digimon e Tamer)", bonus: "x5" },
            { id: "ev_10", start: "10:00", end: "10:10", name: "Drop de ovos", bonus: "x1.5" },
            { id: "ev_11", start: "11:00", end: "11:10", name: "Quantidade de drop", bonus: "x1.5" },
            { id: "ev_12", start: "12:00", end: "12:10", name: "Bits dos monstros", bonus: "x1.5" },
            { id: "ev_13", start: "13:00", end: "13:15", name: "Chance de drop (todos os itens)", bonus: "x1.5" },
            { id: "ev_14", start: "14:00", end: "14:10", name: "Drop de fragmentos e materiais", bonus: "x1.5" },
            { id: "ev_15", start: "15:00", end: "16:00", name: "EXP (Digimon e Tamer)", bonus: "x5" },
            { id: "ev_16", start: "16:00", end: "16:10", name: "Recompensa do scanner", bonus: "x1.5" },
            { id: "ev_17", start: "17:00", end: "17:10", name: "Drop dentro de dungeon", bonus: "x1.5" },
            { id: "ev_18", start: "18:00", end: "18:10", name: "Bits dos monstros", bonus: "x1.5" },
            { id: "ev_19", start: "19:00", end: "19:30", name: "Chance de enchant", bonus: "x2" },
            { id: "ev_20", start: "20:00", end: "20:15", name: "Chance de drop (todos os itens)", bonus: "x1.5" },
            { id: "ev_21", start: "21:00", end: "22:00", name: "EXP (Digimon e Tamer)", bonus: "x5" },
            { id: "ev_22", start: "22:00", end: "22:10", name: "Drop de ovos", bonus: "x1.5" },
            { id: "ev_23", start: "22:15", end: "22:25", name: "Invasão de monstros", bonus: "—" },
            { id: "ev_24", start: "23:00", end: "23:10", name: "Quantidade de drop", bonus: "x1.5" }
        ];

        let alertedEvents = new Set();

        function getUserTimezone() {
            let tz = localStorage.getItem('user_timezone');
            if (!tz) {
                const browserTz = Intl.DateTimeFormat().resolvedOptions().timeZone;
                if (browserTz && browserTz.includes('Europe/Lisbon')) {
                    tz = 'Europe/Lisbon';
                } else {
                    tz = 'America/Sao_Paulo';
                }
            }
            return tz;
        }

        function changeTimezone() {
            const select = document.getElementById('tz-select');
            localStorage.setItem('user_timezone', select.value);
            renderSchedule();
        }

        function getTargetDateFromBRTTime(timeStr, timeZone) {
            const [hours, minutes] = timeStr.split(':').map(Number);
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hh = String(hours).padStart(2, '0');
            const mm = String(minutes).padStart(2, '0');

            return new Date(`${year}-${month}-${day}T${hh}:${mm}:00-03:00`);
        }

        function formatTimeInZone(dateObj, timeZone) {
            return dateObj.toLocaleTimeString('pt-PT', {
                timeZone: timeZone,
                hour: '2-digit',
                minute: '2-digit',
                hour12: false
            });
        }

        // FUNÇÃO QUE REPRODUZ O FICHEIRO MP3 DO DIGIVICE
        function playBeep() {
            const audio = document.getElementById('digivice-audio');
            if (audio) {
                audio.currentTime = 0;
                audio.play().catch(err => {
                    console.log("Reprodução de áudio bloqueada pelo navegador: ", err);
                });
            }
        }

        function testSoundAndNotif() {
            playBeep();
            sendNotification("🔔 Alerta do Digivice", "O som original do Digivice está a tocar perfeitamente!");
        }

        function requestNotificationPermission() {
            if ("Notification" in window) {
                Notification.requestPermission().then(permission => {
                    if (permission === "granted") {
                        const btn = document.getElementById('enable-notif-btn');
                        btn.innerText = "✅ Notificações Ativas";
                        btn.style.borderColor = "#3fb950";
                        btn.style.color = "#3fb950";
                    }
                });
            }
        }

        function sendNotification(title, body) {
            if ("Notification" in window && Notification.permission === "granted") {
                new Notification(title, { body: body, icon: 'https://raw.githubusercontent.com/jmigrade/GalaxyDMO/main/Icons/Checklist.png' });
            }
        }

        function isAlarmEnabled(id) {
            return localStorage.getItem('alarm_' + id) === 'true';
        }

        function toggleAlarm(id) {
            const current = isAlarmEnabled(id);
            localStorage.setItem('alarm_' + id, !current);
        }

        function renderSchedule() {
            const tbody = document.getElementById('schedule-body');
            tbody.innerHTML = '';

            eventsBRT.forEach(ev => {
                const startDate = getTargetDateFromBRTTime(ev.start, 'America/Sao_Paulo');
                const endDate = getTargetDateFromBRTTime(ev.end, 'America/Sao_Paulo');

                const brtStart = formatTimeInZone(startDate, 'America/Sao_Paulo');
                const brtEnd = formatTimeInZone(endDate, 'America/Sao_Paulo');
                const brtRange = `${brtStart} - ${brtEnd}`;

                const ptStart = formatTimeInZone(startDate, 'Europe/Lisbon');
                const ptEnd = formatTimeInZone(endDate, 'Europe/Lisbon');
                const ptRange = `${ptStart} - ${ptEnd}`;

                const checked = isAlarmEnabled(ev.id) ? 'checked' : '';

                const tr = document.createElement('tr');
                tr.id = `row-${ev.id}`;
                tr.innerHTML = `
                    <td class="center-col">
                        <input type="checkbox" class="alarm-checkbox" id="chk-${ev.id}" ${checked} onchange="toggleAlarm('${ev.id}')">
                    </td>
                    <td class="time-cell-brt">${brtRange}</td>
                    <td class="time-cell-pt">${ptRange}</td>
                    <td><strong>${ev.name}</strong></td>
                    <td><span class="bonus-badge">${ev.bonus}</span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function updateClockAndCheckEvents() {
            const now = new Date();
            const userTz = getUserTimezone();

            const localTimeStr = now.toLocaleTimeString('pt-PT', { timeZone: userTz, hour12: false });
            const tzLabel = userTz === 'Europe/Lisbon' ? 'Portugal (PT)' : 'Brasil (BRT)';
            document.getElementById('current-time-local').innerText = `${localTimeStr} (${tzLabel})`;

            eventsBRT.forEach(ev => {
                const startDate = getTargetDateFromBRTTime(ev.start, 'America/Sao_Paulo');
                const endDate = getTargetDateFromBRTTime(ev.end, 'America/Sao_Paulo');
                const row = document.getElementById(`row-${ev.id}`);

                if (now >= startDate && now <= endDate) {
                    if (row) row.classList.add('active-event');

                    if (isAlarmEnabled(ev.id) && !alertedEvents.has(ev.id)) {
                        alertedEvents.add(ev.id);
                        playBeep();
                        sendNotification(`🔔 Evento Ativo: ${ev.name}`, `O evento (${ev.bonus}) começou agora!`);
                    }
                } else {
                    if (row) row.classList.remove('active-event');
                    if (now > endDate) {
                        alertedEvents.delete(ev.id);
                    }
                }
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            const userTz = getUserTimezone();
            document.getElementById('tz-select').value = userTz;

            renderSchedule();
            setInterval(updateClockAndCheckEvents, 1000);
            updateClockAndCheckEvents();

            if ("Notification" in window && Notification.permission === "granted") {
                const btn = document.getElementById('enable-notif-btn');
                btn.innerText = "✅ Notificações Ativas";
                btn.style.borderColor = "#3fb950";
                btn.style.color = "#3fb950";
            }
        });
    </script>

</body>
</html>
