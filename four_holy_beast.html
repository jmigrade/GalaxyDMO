<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digimon Galaxy - Four Holy Beast Equipment</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --sidebar-bg: #11161d;
            --accent-color: #00d2ff;
            --accent-orange: #ff7b00;
            --accent-purple: #a855f7;
            --text-color: #f0f6fc;
            --text-muted: #8b949e;
            --border-color: #30363d;
            --sidebar-width: 260px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            min-height: 100vh;
        }

        /* --- MENU LATERAL (SIDEBAR) --- */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            padding: 20px 14px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            height: 100vh;
            position: sticky;
            top: 0;
            flex-shrink: 0;
        }

        .sidebar-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent-color);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        .nav-menu {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            color: var(--text-color);
            text-decoration: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid transparent;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .nav-link:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--border-color);
        }

        .nav-link.active {
            background: rgba(0, 210, 255, 0.1);
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .nav-link.crafting-link {
            background: rgba(168, 85, 247, 0.1);
            border-color: rgba(168, 85, 247, 0.3);
            color: #d2a8ff;
        }

        .nav-link.crafting-link:hover {
            background: rgba(168, 85, 247, 0.2);
            border-color: var(--accent-purple);
        }

        /* --- CONTEÚDO PRINCIPAL --- */
        .main-content {
            flex-grow: 1;
            padding: 20px;
            max-width: 1350px;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
            padding: 18px 12px;
            background: linear-gradient(135deg, #1f293d, #111827);
            border-radius: 12px;
            border: 1px solid var(--accent-color);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.2);
        }

        .header-title-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 4px;
        }

        .header-icon {
            width: 36px;
            height: 36px;
            object-fit: contain;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            padding: 2px;
        }

        h1 {
            font-size: 1.4rem;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        p.subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* --- ABAS DE EQUIPAMENTO (Ring, Necklace, Earring) --- */
        .equipment-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tab-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .tab-btn:hover {
            border-color: var(--accent-color);
            color: var(--text-color);
        }

        .tab-btn.active {
            background: rgba(0, 210, 255, 0.1);
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .tab-btn img {
            width: 22px;
            height: 22px;
            object-fit: contain;
        }

        .card {
            background: var(--card-bg);
            border-radius: 10px;
            border: 1px solid var(--border-color);
            padding: 20px;
            margin-bottom: 24px;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--accent-orange);
            margin-bottom: 14px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* --- CALCULADORA --- */
        .calc-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }

        @media (max-width: 600px) {
            .calc-grid { grid-template-columns: 1fr; }
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        select {
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 0.95rem;
            outline: none;
        }

        select:focus {
            border-color: var(--accent-color);
        }

        .summary-box {
            background: rgba(0, 210, 255, 0.05);
            border: 1px solid rgba(0, 210, 255, 0.2);
            border-radius: 8px;
            padding: 16px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }

        .summary-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .summary-item .label {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .summary-item .value {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        /* --- TABELA --- */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }

        th {
            background: rgba(255, 255, 255, 0.03);
            color: var(--accent-color);
            font-weight: 600;
            white-space: nowrap;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }

        .tier-cell {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .item-icon {
            width: 34px;
            height: 34px;
            object-fit: contain;
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            padding: 1px;
            flex-shrink: 0;
        }

        .badge-tier {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.8rem;
        }

        .tier-green { background: rgba(35, 134, 54, 0.2); color: #56d364; border: 1px solid rgba(35, 134, 54, 0.4); }
        .tier-blue { background: rgba(0, 210, 255, 0.15); color: #58a6ff; border: 1px solid rgba(0, 210, 255, 0.3); }
        .tier-purple { background: rgba(168, 85, 247, 0.2); color: #d2a8ff; border: 1px solid rgba(168, 85, 247, 0.4); }
        .tier-orange { background: rgba(255, 123, 0, 0.2); color: #ffa657; border: 1px solid rgba(255, 123, 0, 0.4); }

        .item-with-icon {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; position: relative; }
        }
    </style>
</head>
<body>

    <!-- SIDEBAR DE NAVEGAÇÃO -->
    <aside class="sidebar">
        <div class="sidebar-title">Digimon Galaxy</div>
        <ul class="nav-menu">
            <li>
                <a href="index.html" class="nav-link">
                    📋 Checklist Diário
                </a>
            </li>
            <li>
                <a href="true_digivice.html" class="nav-link crafting-link">
                    ⚡ True Digivice Steps
                </a>
            </li>
            <li>
                <a href="four_holy_beast.html" class="nav-link crafting-link active">
                    💍 Four Holy Beast Ring
                </a>
            </li>
            <li>
                <a href="tamer_goggles.html" class="nav-link crafting-link">
                    🥽 Tamer's Goggles
                </a>
            </li>
        </ul>
    </aside>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="main-content">
        <header>
            <div class="header-title-wrapper">
                <img src="Icons/Xuanwumon's_Shiny_Ring.png" alt="Equipment Icon" class="header-icon" id="header-icon">
                <h1 id="header-title">Four Holy Beast Ring</h1>
            </div>
            <p class="subtitle" id="header-subtitle">Guia de Craft e Materiais (Lv. 1 ao Lv. 5)</p>
        </header>

        <!-- ABAS DE SELEÇÃO DE EQUIPAMENTO -->
        <div class="equipment-tabs">
            <button class="tab-btn active" onclick="switchEquipment('ring')">
                <img src="Icons/Xuanwumon's_Shiny_Ring.png" alt=""> Ring
            </button>
            <button class="tab-btn" onclick="switchEquipment('necklace')">
                <img src="Icons/Zhuqiaomon's_Shiny_Necklace.png" alt=""> Necklace
            </button>
            <button class="tab-btn" onclick="switchEquipment('earring')">
                <img src="Icons/Baihumon's_Shiny_Earring.png" alt=""> Earring
            </button>
        </div>

        <!-- CALCULADORA DE MATERIAIS -->
        <div class="card">
            <div class="card-title">🧮 Calculadora de Materiais Necessários</div>
            <div class="calc-grid">
                <div class="form-group">
                    <label for="current-lvl">Nível Atual:</label>
                    <select id="current-lvl" onchange="calculate()">
                        <option value="0">Nenhum (Começar do zero)</option>
                        <option value="1">Lv. 1</option>
                        <option value="2">Lv. 2</option>
                        <option value="3">Lv. 3</option>
                        <option value="4">Lv. 4</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="target-lvl">Nível Desejado:</label>
                    <select id="target-lvl" onchange="calculate()">
                        <option value="1">Lv. 1</option>
                        <option value="2">Lv. 2</option>
                        <option value="3">Lv. 3</option>
                        <option value="4">Lv. 4</option>
                        <option value="5" selected>Lv. 5</option>
                    </select>
                </div>
            </div>

            <div class="summary-box" id="summary-box">
                <!-- Gerado Dinamicamente -->
            </div>
        </div>

        <!-- TABELA DE MATERIAIS E STATUS -->
        <div class="card">
            <div class="card-title" id="table-card-title">📋 Requisitos por Nível (Crafting Table)</div>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr id="table-headers">
                            <!-- Gerado Dinamicamente -->
                        </tr>
                    </thead>
                    <tbody id="craft-table-body">
                        <!-- Gerado Dinamicamente -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        // Dados para cada tipo de equipamento dos Quatro Monstros Sagrados
        const equipmentData = {
            ring: {
                title: "Four Holy Beast Ring",
                subtitle: "Guia de Craft e Materiais (Lv. 1 ao Lv. 5)",
                headerIcon: "Icons/Xuanwumon's_Shiny_Ring.png",
                mat1Name: "Xuanwumon's Shiny Ring",
                mat1Icon: "Icons/Xuanwumon's_Shiny_Ring.png",
                mat2Name: "Jack Frost of Water Crystal",
                mat2Icon: "Icons/Jack_Frost_of_Water_Crystal.png",
                levels: [
                    { lvl: 1, name: "Ring of Four Holy Beasts [Lv 1]", prev: "-", mat1: 1, mat2: 5, bits: 500000000, badge: "tier-green", icon: "Icons/Xuanwumon's_Shiny_Ring.png" },
                    { lvl: 2, name: "Ring of Four Holy Beasts [Lv 2]", prev: "Ring of Four Holy Beasts [Lv 1]", mat1: 1, mat2: 10, bits: 500000000, badge: "tier-green", icon: "Icons/Xuanwumon's_Shiny_Ring.png" },
                    { lvl: 3, name: "Ring of Four Holy Beasts [Lv 3]", prev: "Ring of Four Holy Beasts [Lv 2]", mat1: 1, mat2: 15, bits: 800000000, badge: "tier-blue", icon: "Icons/Xuanwumon's_Shiny_Ring.png" },
                    { lvl: 4, name: "Ring of Four Holy Beasts [Lv 4]", prev: "Ring of Four Holy Beasts [Lv 3]", mat1: 2, mat2: 20, bits: 1000000000, badge: "tier-purple", icon: "Icons/Xuanwumon's_Shiny_Ring.png" },
                    { lvl: 5, name: "Ring of Four Holy Beasts [Lv 5]", prev: "Ring of Four Holy Beasts [Lv 4]", mat1: 2, mat2: 25, bits: 1500000000, badge: "tier-orange", icon: "Icons/Xuanwumon's_Shiny_Ring.png" }
                ]
            },
            necklace: {
                title: "Four Holy Beast Necklace",
                subtitle: "Guia de Craft e Materiais (Lv. 1 ao Lv. 5)",
                headerIcon: "Icons/Zhuqiaomon's_Shiny_Necklace.png",
                mat1Name: "Zhuqiaomon's Shiny Necklace",
                mat1Icon: "Icons/Zhuqiaomon's_Shiny_Necklace.png",
                mat2Name: "Flame of Fire Crystal", // Substitua pelo ícone/nome correto se houver
                mat2Icon: "Icons/Flame.png",
                levels: [
                    { lvl: 1, name: "Necklace of Four Holy Beasts [Lv 1]", prev: "-", mat1: 1, mat2: 5, bits: 500000000, badge: "tier-green", icon: "Icons/Zhuqiaomon's_Shiny_Necklace.png" },
                    { lvl: 2, name: "Necklace of Four Holy Beasts [Lv 2]", prev: "Necklace of Four Holy Beasts [Lv 1]", mat1: 1, mat2: 10, bits: 500000000, badge: "tier-green", icon: "Icons/Zhuqiaomon's_Shiny_Necklace.png" },
                    { lvl: 3, name: "Necklace of Four Holy Beasts [Lv 3]", prev: "Necklace of Four Holy Beasts [Lv 2]", mat1: 1, mat2: 15, bits: 800000000, badge: "tier-blue", icon: "Icons/Zhuqiaomon's_Shiny_Necklace.png" },
                    { lvl: 4, name: "Necklace of Four Holy Beasts [Lv 4]", prev: "Necklace of Four Holy Beasts [Lv 3]", mat1: 2, mat2: 20, bits: 1000000000, badge: "tier-purple", icon: "Icons/Zhuqiaomon's_Shiny_Necklace.png" },
                    { lvl: 5, name: "Necklace of Four Holy Beasts [Lv 5]", prev: "Necklace of Four Holy Beasts [Lv 4]", mat1: 2, mat2: 25, bits: 1500000000, badge: "tier-orange", icon: "Icons/Zhuqiaomon's_Shiny_Necklace.png" }
                ]
            },
            earring: {
                title: "Four Holy Beast Earring",
                subtitle: "Guia de Craft e Materiais (Lv. 1 ao Lv. 5)",
                headerIcon: "Icons/Baihumon's_Shiny_Earring.png",
                mat1Name: "Baihumon's Shiny Earring",
                mat1Icon: "Icons/Baihumon's_Shiny_Earring.png",
                mat2Name: "Steel Crystal", // Substitua pelo ícone/nome correto se houver
                mat2Icon: "Icons/Feet.png",
                levels: [
                    { lvl: 1, name: "Earring of Four Holy Beasts [Lv 1]", prev: "-", mat1: 1, mat2: 5, bits: 500000000, badge: "tier-green", icon: "Icons/Baihumon's_Shiny_Earring.png" },
                    { lvl: 2, name: "Earring of Four Holy Beasts [Lv 2]", prev: "Earring of Four Holy Beasts [Lv 1]", mat1: 1, mat2: 10, bits: 500000000, badge: "tier-green", icon: "Icons/Baihumon's_Shiny_Earring.png" },
                    { lvl: 3, name: "Earring of Four Holy Beasts [Lv 3]", prev: "Earring of Four Holy Beasts [Lv 2]", mat1: 1, mat2: 15, bits: 800000000, badge: "tier-blue", icon: "Icons/Baihumon's_Shiny_Earring.png" },
                    { lvl: 4, name: "Earring of Four Holy Beasts [Lv 4]", prev: "Earring of Four Holy Beasts [Lv 3]", mat1: 2, mat2: 20, bits: 1000000000, badge: "tier-purple", icon: "Icons/Baihumon's_Shiny_Earring.png" },
                    { lvl: 5, name: "Earring of Four Holy Beasts [Lv 5]", prev: "Earring of Four Holy Beasts [Lv 4]", mat1: 2, mat2: 25, bits: 1500000000, badge: "tier-orange", icon: "Icons/Baihumon's_Shiny_Earring.png" }
                ]
            }
        };

        let currentEquipmentType = 'ring';

        function switchEquipment(type) {
            currentEquipmentType = type;
            
            // Atualizar classes dos botões das abas
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');

            // Atualizar Cabeçalho
            const data = equipmentData[type];
            document.getElementById('header-title').innerText = data.title;
            document.getElementById('header-subtitle').innerText = data.subtitle;
            document.getElementById('header-icon').src = data.headerIcon;

            renderTable();
            calculate();
        }

        function formatBits(bits) {
            if (bits === 0) return "0 Bits";
            let t = Math.floor(bits / 1000000000);
            let m = Math.floor((bits % 1000000000) / 1000000);
            let res = [];
            if (t > 0) res.push(`${t} T`);
            if (m > 0) res.push(`${m} M`);
            return res.join(' ');
        }

        function renderTable() {
            const data = equipmentData[currentEquipmentType];
            
            // Renderizar cabeçalhos da tabela dinamicamente
            const headersTr = document.getElementById('table-headers');
            headersTr.innerHTML = `
                <th>Nível</th>
                <th>Item Anterior Requerido</th>
                <th><div class="item-with-icon"><img src="${data.mat1Icon}" class="item-icon" alt=""> ${data.mat1Name}</div></th>
                <th><div class="item-with-icon"><img src="${data.mat2Icon}" class="item-icon" alt=""> ${data.mat2Name}</div></th>
                <th>Custo em Bits</th>
            `;

            const tbody = document.getElementById('craft-table-body');
            tbody.innerHTML = '';

            data.levels.forEach(item => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>
                        <div class="tier-cell">
                            <img src="${item.icon}" class="item-icon" alt="">
                            <span class="badge-tier ${item.badge}">${item.lvl}</span>
                        </div>
                    </td>
                    <td style="font-size: 0.85rem; color: var(--text-muted);">${item.prev}</td>
                    <td>${item.mat1}</td>
                    <td>${item.mat2}</td>
                    <td style="font-weight: bold; color: var(--accent-orange);">${formatBits(item.bits)}</td>
                `;
                tbody.appendChild(row);
            });
        }

        function calculate() {
            const data = equipmentData[currentEquipmentType];
            const currentSelect = document.getElementById('current-lvl');
            const targetSelect = document.getElementById('target-lvl');
            
            let current = parseInt(currentSelect.value); // 0 a 4
            let target = parseInt(targetSelect.value);   // 1 a 5

            if (current >= target) {
                target = Math.min(current + 1, 5);
                if (current >= 5) current = 4;
                targetSelect.value = target;
                currentSelect.value = current;
            }

            let totalMat1 = 0;
            let totalMat2 = 0;
            let totalBits = 0;

            for (let i = current; i < target; i++) {
                if (data.levels[i]) {
                    totalMat1 += data.levels[i].mat1;
                    totalMat2 += data.levels[i].mat2;
                    totalBits += data.levels[i].bits;
                }
            }

            const summaryBox = document.getElementById('summary-box');
            summaryBox.innerHTML = `
                <div class="summary-item">
                    <span class="label">💰 Bits Totais:</span>
                    <span class="value" style="color: var(--accent-orange);">${formatBits(totalBits)}</span>
                </div>
                <div class="summary-item">
                    <span class="label"><img src="${data.mat1Icon}" class="item-icon" alt=""> ${data.mat1Name}:</span>
                    <span class="value">${totalMat1}</span>
                </div>
                <div class="summary-item">
                    <span class="label"><img src="${data.mat2Icon}" class="item-icon" alt=""> ${data.mat2Name}:</span>
                    <span class="value">${totalMat2}</span>
                </div>
            `;
        }

        // Inicializar com o Ring ao carregar a página
        renderTable();
        calculate();
    </script>
</body>
</html>
